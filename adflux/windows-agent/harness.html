<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untitled Work - UI harness (dev only, not shipped)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" />
</head><body><div id="app"></div>
<script type="module">
// Dev-only harness: fakes Tauri + Supabase so every screen can be looked at in a normal browser.
import { SUPABASE_URL } from './src/config.js'
const q = new URLSearchParams(location.search)
const state = q.get('state') || 'running'
const now = Date.now()
const iso = (ms) => new Date(ms).toISOString()
const USER = { id: 'u1', email: 'safika@example.com', aud: 'authenticated', role: 'authenticated', app_metadata: {}, user_metadata: {}, created_at: iso(now) }
const ref = new URL(SUPABASE_URL).hostname.split('.')[0]
if (state !== 'login') {
  localStorage.setItem(`sb-${ref}-auth-token`, JSON.stringify({ access_token: 'x.y.z', refresh_token: 'r', token_type: 'bearer', expires_in: 3600, expires_at: Math.floor(now / 1000) + 3600, user: USER }))
} else localStorage.removeItem(`sb-${ref}-auth-token`)
const cfg = { tracked: state !== 'untracked', screenshot_interval_min: 10, idle_minutes: 5, consent_at: state === 'consent' ? null : iso(now - 3600e3) }
const projects = [{ id: 'p1', name: 'SIRACHCHA BHARAT MISSION' }, { id: 'p2', name: 'Anee Marcom Pvt Ltd' }, { id: 'p3', name: 'UNTITLED ADVERTISING' }]
const running = { id: 'e2', user_id: 'u1', project_id: 'p1', task_id: null, part_id: 'pt1', task_label: 'Reel 1 edit', started_at: iso(now - 2 * 3600e3 - 14 * 60e3), ended_at: null, break_seconds: 0, status: 'approved' }
const done = { id: 'e1', user_id: 'u1', project_id: 'p2', task_label: 'Post banner', started_at: iso(now - 5 * 3600e3), ended_at: iso(now - 2.5 * 3600e3), break_seconds: 0, status: 'approved' }
const parts = [
  { id: 'pt1', task_id: 't1', label: 'Reel 1', due_date: '2026-10-18', status: 'in_process', task: { title: 'Reel 1 edit', project_id: 'p1', due_date: '2026-10-18' } },
  { id: 'pt2', task_id: 't2', label: null, due_date: '2026-10-15', status: 'assigned', task: { title: 'End-date report and remove campaign - a to z the home store', project_id: 'p2', due_date: '2026-10-15' } },
  { id: 'pt3', task_id: 't3', label: 'Layout', due_date: '2026-10-14', status: 'assigned', task: { title: 'DIVF BROCHURE WORK AND PRINTING', project_id: 'p3', due_date: '2026-10-14' } },
]
const json = (b, s = 200) => new Response(JSON.stringify(b), { status: s, headers: { 'content-type': 'application/json' } })
const realFetch = window.fetch.bind(window)
window.fetch = async (input, init = {}) => {
  const url = typeof input === 'string' ? input : input.url
  if (!url.startsWith(SUPABASE_URL)) return realFetch(input, init)
  const path = url.slice(SUPABASE_URL.length)
  const accept = (init.headers && (init.headers.Accept || init.headers.accept)) || ''
  const one = (row) => (accept.includes('vnd.pgrst.object') ? (row ? json(row) : json({ message: 'none' }, 406)) : json(row ? [row] : []))
  if (path.startsWith('/auth/v1/user')) return json(USER)
  if (path.startsWith('/auth/v1/token')) return json({ access_token: 'x.y.z', refresh_token: 'r', token_type: 'bearer', expires_in: 3600, expires_at: Math.floor(Date.now() / 1000) + 3600, user: USER })
  if (path.startsWith('/rest/v1/rpc/work_agent_config')) return json(cfg)
  if (path.startsWith('/rest/v1/rpc/')) return json(null)
  if (path.startsWith('/rest/v1/users')) return one({ name: 'SAFIKA ZULFIKARALI BANSIWALA', role: 'staff' })
  if (path.startsWith('/rest/v1/work_projects')) return json(state === 'empty' ? [] : projects)
  if (path.startsWith('/rest/v1/work_task_parts')) return json(state === 'empty' ? [] : parts)
  if (path.startsWith('/rest/v1/work_time_entries')) {
    if (path.includes('ended_at=is.null')) return one(state === 'running' || state === 'consent' || state === 'untracked' ? running : null)
    return json(state === 'empty' ? [] : state === 'running' || state === 'consent' ? [done, running] : [done])
  }
  return json([])
}
window.__TAURI_INTERNALS__ = {
  transformCallback: (cb) => { const id = Math.floor(Math.random() * 1e9); window[`_${id}`] = cb; return id },
  invoke: async (cmd) => {
    if (cmd === 'idle_seconds') return 3
    if (cmd === 'active_window') return { program: 'Photoshop', title: 'PostBanner.psd' }
    if (cmd === 'device_name') return 'DESIGN-PC-01'
    if (cmd === 'autostart_enabled') return true
    if (cmd === 'plugin:event|listen') return 1
    return null
  },
}
if (!q.get('view')) { const u = new URL(location.href); u.searchParams.set('view', 'main'); history.replaceState(null, '', u) }
await import('./src/main.js')
</script></body></html>
