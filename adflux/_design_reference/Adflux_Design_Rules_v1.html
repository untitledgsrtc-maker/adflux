  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

f2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"23d604ce-03ec-4e5c-aa5f-ee775cec5e43\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --bg: #0f172a;\n    --surface: #1e293b;\n    --surface-2: #334155;\n    --surface-3: #475569;\n    --border: #334155;\n    --border-soft: rgba(255,255,255,.07);\n    --text: #f1f5f9;\n    --text-muted: #94a3b8;\n    --text-subtle: #64748b;\n    --accent: #FFE600;\n    --accent-ink: #0f172a;\n    --success: #10B981;\n    --warning: #F59E0B;\n    --danger: #EF4444;\n    --blue: #3B82F6;\n    --purple: #c084fc;\n    --teal-1: #0d3d3a;\n    --teal-2: #134e4a;\n    --teal-3: #0f766e;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: #070b16;\n    color: var(--text);\n    font-family: 'DM Sans', system-ui, sans-serif;\n    font-size: 15px;\n    line-height: 1.6;\n    -webkit-font-smoothing: antialiased;\n  }\n  .page {\n    max-width: 920px;\n    margin: 0 auto;\n    padding: 0 28px 80px;\n  }\n  h1, h2, h3, h4, .display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -.01em; }\n  .mono { font-family: 'JetBrains Mono', monospace; }\n  .guj { font-family: 'Noto Sans Gujarati', sans-serif; }\n  a { color: var(--accent); }\n\n  /* Cover */\n  .cover {\n    background:\n      radial-gradient(800px 300px at 100% 0%, rgba(255,230,0,.20), transparent 60%),\n      radial-gradient(600px 280px at 0% 100%, rgba(192,132,252,.16), transparent 60%),\n      linear-gradient(135deg, var(--teal-1) 0%, var(--teal-2) 55%, var(--teal-3) 100%);\n    border-radius: 22px;\n    padding: 56px 48px;\n    margin: 36px 0 40px;\n    position: relative;\n    overflow: hidden;\n    border: 1px solid #1c5856;\n  }\n  .cover .mark {\n    width: 56px; height: 56px; border-radius: 14px;\n    background: var(--accent); color: var(--accent-ink);\n    display: grid; place-items: center;\n    font-family: 'Space Grotesk'; font-weight: 700; font-size: 30px;\n    box-shadow: 0 8px 28px rgba(255,230,0,.30);\n    margin-bottom: 26px;\n  }\n  .cover .eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.7); }\n  .cover h1 { font-size: 46px; font-weight: 600; margin: 10px 0 12px; line-height: 1.05; }\n  .cover p { color: rgba(255,255,255,.8); font-size: 16px; max-width: 560px; margin: 0; }\n  .cover .meta { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }\n  .cover .meta .chip {\n    background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18);\n    color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 500;\n  }\n\n  /* TOC */\n  .toc {\n    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 24px;\n    background: var(--surface); border: 1px solid var(--border);\n    border-radius: 16px; padding: 22px 24px; margin-bottom: 48px;\n  }\n  .toc .lbl { grid-column: 1 / -1; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 4px; }\n  .toc a { display: flex; gap: 12px; align-items: baseline; color: var(--text); text-decoration: none; padding: 5px 0; font-size: 14px; }\n  .toc a:hover { color: var(--accent); }\n  .toc a .n { font-family: 'JetBrains Mono'; color: var(--accent); font-size: 12px; width: 24px; flex-shrink: 0; }\n\n  /* Sections */\n  section { margin-bottom: 56px; scroll-margin-top: 24px; }\n  .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; padding-bottom: 14px; border-bottom: 2px solid var(--border); }\n  .sec-head .n { font-family: 'JetBrains Mono'; color: var(--accent); font-size: 14px; }\n  .sec-head h2 { font-size: 28px; font-weight: 600; margin: 0; }\n  .sec-intro { color: var(--text-muted); margin: 0 0 24px; font-size: 15px; max-width: 680px; }\n\n  h3 { font-size: 17px; font-weight: 600; margin: 28px 0 12px; }\n  p { margin: 0 0 14px; }\n  .muted { color: var(--text-muted); }\n\n  /* Rule callout */\n  .rule {\n    display: flex; gap: 12px; align-items: flex-start;\n    background: var(--surface); border: 1px solid var(--border);\n    border-left: 3px solid var(--accent);\n    border-radius: 0 10px 10px 0; padding: 14px 16px; margin: 10px 0;\n  }\n  .rule .ic { color: var(--accent); flex-shrink: 0; font-weight: 700; font-family: 'Space Grotesk'; }\n  .rule.do { border-left-color: var(--success); }\n  .rule.do .ic { color: var(--success); }\n  .rule.dont { border-left-color: var(--danger); }\n  .rule.dont .ic { color: var(--danger); }\n  .rule .b { font-size: 14px; }\n  .rule .b b { font-weight: 600; }\n\n  /* Swatch grid */\n  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 16px 0; }\n  .swatch { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }\n  .swatch .chip { height: 64px; }\n  .swatch .info { padding: 10px 12px; }\n  .swatch .nm { font-size: 13px; font-weight: 600; }\n  .swatch .hex { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--text-muted); margin-top: 2px; }\n  .swatch .use { font-size: 11px; color: var(--text-subtle); margin-top: 4px; }\n\n  /* Token table */\n  table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }\n  th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-subtle); padding: 10px 12px; border-bottom: 1px solid var(--border); }\n  td { padding: 10px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }\n  td .mono { font-size: 12px; color: var(--text-muted); }\n  tr:last-child td { border-bottom: 0; }\n  .tok-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 6px 8px; }\n\n  /* Type specimen */\n  .type-row { display: flex; align-items: baseline; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--border-soft); }\n  .type-row:last-child { border-bottom: 0; }\n  .type-row .spec { width: 130px; flex-shrink: 0; font-size: 11px; color: var(--text-subtle); }\n  .type-row .spec .mono { display: block; color: var(--text-muted); margin-top: 2px; }\n  .type-sample { flex: 1; min-width: 0; }\n\n  /* Component preview cards */\n  .preview { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin: 14px 0; }\n  .preview-lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 14px; }\n  .demo-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }\n\n  /* mini components */\n  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: default; }\n  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }\n  .btn.ghost { background: transparent; }\n  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; }\n  .pill.s { background: rgba(16,185,129,.14); color: var(--success); }\n  .pill.w { background: rgba(245,158,11,.14); color: var(--warning); }\n  .pill.d { background: rgba(239,68,68,.14); color: var(--danger); }\n  .pill.b { background: rgba(59,130,246,.14); color: var(--blue); }\n  .stage { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }\n  .stage::before { content: \"\"; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }\n  .stage.won::before { background: var(--success); }\n  .stage.lost::before { background: var(--danger); }\n  .heat { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--danger); box-shadow: 0 0 6px rgba(239,68,68,.6); }\n  .av { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-family: 'Space Grotesk'; font-weight: 600; font-size: 11px; background: #fde68a; color: #92400e; }\n  .hero-demo {\n    background: radial-gradient(300px 120px at 100% 0%, rgba(255,230,0,.22), transparent 60%), linear-gradient(135deg, var(--teal-1), var(--teal-3));\n    border: 1px solid #1c5856; border-radius: 14px; padding: 16px 18px; color: #fff;\n  }\n  .hero-demo .l { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.65); }\n  .hero-demo .v { font-family: 'Space Grotesk'; font-weight: 600; font-size: 28px; color: var(--accent); margin-top: 4px; }\n  .hero-demo .d { font-size: 12px; color: rgba(255,255,255,.7); margin-top: 2px; }\n\n  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n  .scale-bar { display: flex; align-items: flex-end; gap: 8px; height: 80px; margin: 14px 0; }\n  .scale-bar .u { background: var(--accent); border-radius: 4px 4px 0 0; position: relative; min-width: 30px; }\n  .scale-bar .u .t { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); padding-top: 6px; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--text-subtle); white-space: nowrap; }\n\n  .footer { margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 12px; color: var(--text-subtle); }\n\n  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }\n\n  @media print {\n    body { background: #fff; color: #0f172a; }\n    .page { max-width: 100%; }\n    section { break-inside: avoid; }\n    .cover { -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n  }\n  @media (max-width: 680px) {\n    .toc, .two-col, .grid-2 { grid-template-columns: 1fr; }\n    .swatches { grid-template-columns: repeat(2, 1fr); }\n    .cover h1 { font-size: 34px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\">\n\n  <!-- COVER -->\n  <div class=\"cover\">\n    <div class=\"mark\">A<\u002Fdiv>\n    <div class=\"eyebrow\">Adflux · Product Design System<\u002Fdiv>\n    <h1>Design Rules<\u002Fh1>\n    <p>The single source of truth for building Adflux screens — dashboards, the Sales module, mobile apps, and everything in between. Hand this to any designer or developer and they can match the system.<\u002Fp>\n    <div class=\"meta\">\n      <span class=\"chip\">v1.0 · June 2026<\u002Fspan>\n      <span class=\"chip\">Dark + Light themes<\u002Fspan>\n      <span class=\"chip\">Mobile-first<\u002Fspan>\n      <span class=\"chip\">Gujarati-ready<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TOC -->\n  <nav class=\"toc\">\n    <div class=\"lbl\">Contents<\u002Fdiv>\n    <a href=\"#principles\"><span class=\"n\">01<\u002Fspan> Principles<\u002Fa>\n    <a href=\"#color\"><span class=\"n\">02<\u002Fspan> Color<\u002Fa>\n    <a href=\"#type\"><span class=\"n\">03<\u002Fspan> Typography<\u002Fa>\n    <a href=\"#space\"><span class=\"n\">04<\u002Fspan> Spacing &amp; Radius<\u002Fa>\n    <a href=\"#icons\"><span class=\"n\">05<\u002Fspan> Icons<\u002Fa>\n    <a href=\"#components\"><span class=\"n\">06<\u002Fspan> Components<\u002Fa>\n    <a href=\"#hero\"><span class=\"n\">07<\u002Fspan> Hero &amp; Data Viz<\u002Fa>\n    <a href=\"#voice\"><span class=\"n\">08<\u002Fspan> Voice &amp; Gujarati<\u002Fa>\n    <a href=\"#theming\"><span class=\"n\">09<\u002Fspan> Day / Night<\u002Fa>\n    <a href=\"#checklist\"><span class=\"n\">10<\u002Fspan> Build Checklist<\u002Fa>\n  <\u002Fnav>\n\n  <!-- 01 PRINCIPLES -->\n  <section id=\"principles\">\n    <div class=\"sec-head\"><span class=\"n\">01<\u002Fspan><h2>Principles<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Five rules that decide every design call. When in doubt, re-read these.<\u002Fp>\n\n    <div class=\"rule\"><span class=\"ic\">1<\u002Fspan><div class=\"b\"><b>One primary action per screen.<\u002Fb> The single most important thing the user should do is the biggest, the boldest, and the only yellow button on the screen. Everything else is secondary (outline) or tertiary (text).<\u002Fdiv><\u002Fdiv>\n    <div class=\"rule\"><span class=\"ic\">2<\u002Fspan><div class=\"b\"><b>Money is sacred.<\u002Fb> Rupee amounts, pipeline totals, incentives and scores get <b>Space Grotesk<\u002Fb> at 22–42px. They are always the loudest number in any card.<\u002Fdiv><\u002Fdiv>\n    <div class=\"rule\"><span class=\"ic\">3<\u002Fspan><div class=\"b\"><b>Mobile is the default.<\u002Fb> Field reps live on their phones. Design for the thumb first: primary actions in the bottom third, identity/status up top, 44px minimum tap targets.<\u002Fdiv><\u002Fdiv>\n    <div class=\"rule\"><span class=\"ic\">4<\u002Fspan><div class=\"b\"><b>Status uses tokens, never new colors.<\u002Fb> Green = good, amber = attention, red = urgent, blue = info, purple = AI/voice. Don't invent hues.<\u002Fdiv><\u002Fdiv>\n    <div class=\"rule\"><span class=\"ic\">5<\u002Fspan><div class=\"b\"><b>Every screen earns a hero.<\u002Fb> A teal hero card anchors each screen with the one number that matters there — today's revenue, score, SLA, queue size.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 COLOR -->\n  <section id=\"color\">\n    <div class=\"sec-head\"><span class=\"n\">02<\u002Fspan><h2>Color<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Yellow is the brand and the only call-to-action color. Deep navy surfaces in night mode, clean whites in day. Teal is reserved for hero moments.<\u002Fp>\n\n    <h3>Brand &amp; Action<\u002Fh3>\n    <div class=\"swatches\">\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#FFE600\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Accent<\u002Fdiv><div class=\"hex\">#FFE600<\u002Fdiv><div class=\"use\">CTAs, key numbers, active states<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#0f172a\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Accent Ink<\u002Fdiv><div class=\"hex\">#0f172a<\u002Fdiv><div class=\"use\">Text on yellow<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:linear-gradient(135deg,#0d3d3a,#0f766e)\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Teal Hero<\u002Fdiv><div class=\"hex\">#0d3d3a → #0f766e<\u002Fdiv><div class=\"use\">Hero card gradients only<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#c084fc\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Purple<\u002Fdiv><div class=\"hex\">#c084fc<\u002Fdiv><div class=\"use\">AI &amp; voice features<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3>Status<\u002Fh3>\n    <div class=\"swatches\">\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#10B981\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Success<\u002Fdiv><div class=\"hex\">#10B981<\u002Fdiv><div class=\"use\">Won, paid, on-target<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#F59E0B\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Warning<\u002Fdiv><div class=\"hex\">#F59E0B<\u002Fdiv><div class=\"use\">Due soon, attention<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#EF4444\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Danger<\u002Fdiv><div class=\"hex\">#EF4444<\u002Fdiv><div class=\"use\">Overdue, hot, SLA breach<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#3B82F6\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Info<\u002Fdiv><div class=\"hex\">#3B82F6<\u002Fdiv><div class=\"use\">New, contacted, neutral<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3>Neutrals — Night (default)<\u002Fh3>\n    <div class=\"swatches\">\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#0f172a\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Background<\u002Fdiv><div class=\"hex\">#0f172a<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#1e293b\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Surface<\u002Fdiv><div class=\"hex\">#1e293b<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#334155\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Surface 2<\u002Fdiv><div class=\"hex\">#334155<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#475569\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Surface 3<\u002Fdiv><div class=\"hex\">#475569<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"rule do\"><span class=\"ic\">✓<\u002Fspan><div class=\"b\"><b>Do<\u002Fb> use tints (12–16% opacity of a status color) for chip and icon-tile backgrounds.<\u002Fdiv><\u002Fdiv>\n    <div class=\"rule dont\"><span class=\"ic\">✕<\u002Fspan><div class=\"b\"><b>Don't<\u002Fb> use yellow for anything except the one primary action and the single hero number. Two yellow buttons on a screen = bug.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 TYPE -->\n  <section id=\"type\">\n    <div class=\"sec-head\"><span class=\"n\">03<\u002Fspan><h2>Typography<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Three families, each with one job. Never substitute.<\u002Fp>\n\n    <div class=\"two-col\">\n      <div class=\"tok-card\" style=\"padding:18px 20px\">\n        <div style=\"font-family:'Space Grotesk';font-size:32px;font-weight:600\">Space Grotesk<\u002Fdiv>\n        <p class=\"muted\" style=\"margin:8px 0 0;font-size:13px\">Headings, numbers, money, scores. The \"loud\" font.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tok-card\" style=\"padding:18px 20px\">\n        <div style=\"font-family:'DM Sans';font-size:32px;font-weight:500\">DM Sans<\u002Fdiv>\n        <p class=\"muted\" style=\"margin:8px 0 0;font-size:13px\">Body, labels, UI copy. The workhorse.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tok-card\" style=\"padding:18px 20px;margin-top:14px\">\n      <div class=\"mono\" style=\"font-size:26px\">JetBrains Mono<\u002Fdiv>\n      <p class=\"muted\" style=\"margin:8px 0 0;font-size:13px\">Reference numbers, phone numbers, timestamps, GPS coords. <span class=\"mono\">UA/PR/2026-27/0078<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n\n    <h3>Type scale<\u002Fh3>\n    <div class=\"tok-card\">\n      <div class=\"type-row\"><div class=\"spec\">Display<span class=\"mono\">Grotesk 46 / 600<\u002Fspan><\u002Fdiv><div class=\"type-sample\" style=\"font-family:'Space Grotesk';font-size:38px;font-weight:600;line-height:1.1\">₹3,80,000<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\">H1 · Page<span class=\"mono\">Grotesk 26 / 600<\u002Fspan><\u002Fdiv><div class=\"type-sample\" style=\"font-family:'Space Grotesk';font-size:26px;font-weight:600\">Leads<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\">H2 · Section<span class=\"mono\">Grotesk 18 / 600<\u002Fspan><\u002Fdiv><div class=\"type-sample\" style=\"font-family:'Space Grotesk';font-size:18px;font-weight:600\">Today's route<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\">Card title<span class=\"mono\">DM Sans 13 / 600<\u002Fspan><\u002Fdiv><div class=\"type-sample\" style=\"font-size:13px;font-weight:600\">Pending hand-offs<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\">Body<span class=\"mono\">DM Sans 14 / 400<\u002Fspan><\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">Demo scheduled. Owner is decision maker.<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\">Eyebrow<span class=\"mono\">DM Sans 11 / 600 · .14em caps<\u002Fspan><\u002Fdiv><div class=\"type-sample\" style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle);font-weight:600\">Expected value<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"rule\"><span class=\"ic\">↳<\u002Fspan><div class=\"b\">Minimum body size is <b>12px<\u002Fb> (mobile), <b>13px<\u002Fb> for dense tables. Eyebrows are always uppercase with <span class=\"mono\">.14em<\u002Fspan> letter-spacing.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 SPACING -->\n  <section id=\"space\">\n    <div class=\"sec-head\"><span class=\"n\">04<\u002Fspan><h2>Spacing &amp; Radius<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">A simple 4-based rhythm. Generous radii keep the system friendly, not corporate.<\u002Fp>\n\n    <div class=\"grid-2\">\n      <div>\n        <h3>Spacing scale<\u002Fh3>\n        <div class=\"scale-bar\">\n          <div class=\"u\" style=\"height:8px\"><span class=\"t\">4<\u002Fspan><\u002Fdiv>\n          <div class=\"u\" style=\"height:16px\"><span class=\"t\">8<\u002Fspan><\u002Fdiv>\n          <div class=\"u\" style=\"height:24px\"><span class=\"t\">12<\u002Fspan><\u002Fdiv>\n          <div class=\"u\" style=\"height:32px\"><span class=\"t\">16<\u002Fspan><\u002Fdiv>\n          <div class=\"u\" style=\"height:48px\"><span class=\"t\">24<\u002Fspan><\u002Fdiv>\n          <div class=\"u\" style=\"height:64px\"><span class=\"t\">32<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"muted\" style=\"font-size:13px;margin-top:24px\">Card padding <b>16–18px<\u002Fb>. Gaps between cards <b>12–16px<\u002Fb>. Page margins <b>16px<\u002Fb> mobile, <b>24–28px<\u002Fb> desktop.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3>Corner radius<\u002Fh3>\n        <div class=\"demo-row\" style=\"gap:14px\">\n          <div style=\"width:64px;height:64px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px\"><\u002Fdiv>\n          <div style=\"width:64px;height:64px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px\"><\u002Fdiv>\n          <div style=\"width:64px;height:64px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px\"><\u002Fdiv>\n          <div style=\"width:64px;height:64px;background:var(--accent);border-radius:999px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <table>\n          <tbody><tr><td><span class=\"mono\">8px<\u002Fspan><\u002Ftd><td>inputs, small chips, icon tiles<\u002Ftd><\u002Ftr>\n          <tr><td><span class=\"mono\">12px<\u002Fspan><\u002Ftd><td>buttons, inner cards, list items<\u002Ftd><\u002Ftr>\n          <tr><td><span class=\"mono\">14–16px<\u002Fspan><\u002Ftd><td>cards, hero, modals<\u002Ftd><\u002Ftr>\n          <tr><td><span class=\"mono\">999px<\u002Fspan><\u002Ftd><td>pills, avatars, FAB<\u002Ftd><\u002Ftr>\n        <\u002Ftbody><\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 ICONS -->\n  <section id=\"icons\">\n    <div class=\"sec-head\"><span class=\"n\">05<\u002Fspan><h2>Icons<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Line icons only, in the Lucide style. The system is icon-led — every metric, action, and list item carries an icon in a tinted tile.<\u002Fp>\n\n    <table>\n      <tbody><tr><th>Rule<\u002Fth><th>Spec<\u002Fth><\u002Ftr>\n      <tr><td>Style<\u002Ftd><td>Lucide / Feather — outline, rounded caps &amp; joins<\u002Ftd><\u002Ftr>\n      <tr><td>Stroke width<\u002Ftd><td><span class=\"mono\">1.6–1.7<\u002Fspan><\u002Ftd><\u002Ftr>\n      <tr><td>Sizes<\u002Ftd><td><span class=\"mono\">11 · 14 · 16 · 18 · 20 · 22<\u002Fspan> px<\u002Ftd><\u002Ftr>\n      <tr><td>Icon tiles<\u002Ftd><td>Square <span class=\"mono\">28–40px<\u002Fspan>, radius 8–11px, tinted background of the status color at ~14% opacity, icon in full color<\u002Ftd><\u002Ftr>\n      <tr><td>Color<\u002Ftd><td>Inherits the tile's status color — never multi-color<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n\n    <div class=\"preview\">\n      <div class=\"preview-lbl\">Icon tile pattern<\u002Fdiv>\n      <div class=\"demo-row\">\n        <span style=\"width:38px;height:38px;border-radius:11px;background:rgba(59,130,246,.14);color:var(--blue);display:grid;place-items:center\">☎<\u002Fspan>\n        <span style=\"width:38px;height:38px;border-radius:11px;background:rgba(16,185,129,.14);color:var(--success);display:grid;place-items:center\">✓<\u002Fspan>\n        <span style=\"width:38px;height:38px;border-radius:11px;background:rgba(245,158,11,.14);color:var(--warning);display:grid;place-items:center\">◷<\u002Fspan>\n        <span style=\"width:38px;height:38px;border-radius:11px;background:rgba(239,68,68,.14);color:var(--danger);display:grid;place-items:center\">⚠<\u002Fspan>\n        <span style=\"width:38px;height:38px;border-radius:11px;background:rgba(192,132,252,.16);color:var(--purple);display:grid;place-items:center\">✦<\u002Fspan>\n        <span style=\"width:38px;height:38px;border-radius:11px;background:rgba(255,230,0,.14);color:var(--accent);display:grid;place-items:center\">★<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 06 COMPONENTS -->\n  <section id=\"components\">\n    <div class=\"sec-head\"><span class=\"n\">06<\u002Fspan><h2>Components<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">The shared vocabulary. Reuse these — don't reinvent them per screen.<\u002Fp>\n\n    <div class=\"preview\">\n      <div class=\"preview-lbl\">Buttons<\u002Fdiv>\n      <div class=\"demo-row\">\n        <span class=\"btn primary\">★ Primary action<\u002Fspan>\n        <span class=\"btn\">Secondary<\u002Fspan>\n        <span class=\"btn ghost\">Tertiary<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"muted\" style=\"font-size:13px;margin:14px 0 0\">Pill-shaped. One primary (yellow) per screen. Icon + label, never icon-only for key actions.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"preview\">\n      <div class=\"preview-lbl\">Status pills &amp; stage chips<\u002Fdiv>\n      <div class=\"demo-row\">\n        <span class=\"pill s\">Won<\u002Fspan>\n        <span class=\"pill w\">Due soon<\u002Fspan>\n        <span class=\"pill d\">Overdue 4h<\u002Fspan>\n        <span class=\"pill b\">New<\u002Fspan>\n        <span class=\"stage\">SalesReady<\u002Fspan>\n        <span class=\"stage won\">Won<\u002Fspan>\n        <span class=\"stage lost\">Lost<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"muted\" style=\"font-size:13px;margin:14px 0 0\">Stage chips carry a leading colored dot. Pills are tinted by status. Write urgency in plain words (\"Overdue 4h\"), never jargon (\"BREACH\").<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"preview\">\n      <div class=\"preview-lbl\">Lead row · 2 lines max<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-soft)\">\n        <span class=\"heat\"><\u002Fspan>\n        <div style=\"flex:1\">\n          <div style=\"font-weight:500;font-size:15px\">Dr. Mehta <span style=\"color:var(--text-subtle);font-weight:400\">· Sunrise Diagnostics<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-top:4px;font-size:12px;color:var(--text-subtle)\"><span class=\"stage\" style=\"font-size:10px\">SalesReady<\u002Fspan><span>2h ago<\u002Fspan><span style=\"color:var(--danger)\">· Send quote today<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'Space Grotesk';font-weight:600\">₹3.8L<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"muted\" style=\"font-size:13px;margin:14px 0 0\">Line 1: name + company. Line 2: stage · last contact · next action. Heat dot only for hot leads. Value right-aligned in Grotesk.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"preview\">\n      <div class=\"preview-lbl\">Avatars<\u002Fdiv>\n      <div class=\"demo-row\">\n        <span class=\"av\">BR<\u002Fspan>\n        <span class=\"av\" style=\"background:#ddd6fe;color:#5b21b6\">SO<\u002Fspan>\n        <span class=\"av\" style=\"background:#bfdbfe;color:#1e40af\">AR<\u002Fspan>\n        <span class=\"av\" style=\"background:#bbf7d0;color:#166534\">PD<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"muted\" style=\"font-size:13px;margin:14px 0 0\">Initials in Space Grotesk, soft pastel fills. Consistent color per person across the app.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 07 HERO -->\n  <section id=\"hero\">\n    <div class=\"sec-head\"><span class=\"n\">07<\u002Fspan><h2>Hero &amp; Data Viz<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">The hero card is the signature element. Data viz stays minimal — sparklines, ring meters, thin bars. No chart junk.<\u002Fp>\n\n    <div class=\"preview\">\n      <div class=\"preview-lbl\">Hero card<\u002Fdiv>\n      <div class=\"hero-demo\">\n        <div class=\"l\">● &nbsp;Today added<\u002Fdiv>\n        <div class=\"v\">₹3.8L<\u002Fdiv>\n        <div class=\"d\">+₹1.2L vs avg · rank 3 of 6<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"muted\" style=\"font-size:13px;margin:14px 0 0\">Teal gradient, yellow corner glow, the one number in yellow Grotesk, supporting delta below. Every screen gets one.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"grid-2\">\n      <div class=\"preview\">\n        <div class=\"preview-lbl\">Ring meters · milestones<\u002Fdiv>\n        <div class=\"demo-row\" style=\"gap:18px\">\n          <svg width=\"72\" height=\"72\" viewBox=\"0 0 72 72\"><circle cx=\"36\" cy=\"36\" r=\"30\" stroke=\"#334155\" stroke-width=\"7\" fill=\"none\"><\u002Fcircle><circle cx=\"36\" cy=\"36\" r=\"30\" stroke=\"#10B981\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-dasharray=\"188.5\" stroke-dashoffset=\"75\" transform=\"rotate(-90 36 36)\"><\u002Fcircle><text x=\"36\" y=\"40\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-weight=\"600\" font-size=\"16\" fill=\"#f1f5f9\">3/5<\u002Ftext><\u002Fsvg>\n          <svg width=\"72\" height=\"72\" viewBox=\"0 0 72 72\"><circle cx=\"36\" cy=\"36\" r=\"30\" stroke=\"#334155\" stroke-width=\"7\" fill=\"none\"><\u002Fcircle><circle cx=\"36\" cy=\"36\" r=\"30\" stroke=\"#FFE600\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\" stroke-dasharray=\"188.5\" stroke-dashoffset=\"94\" transform=\"rotate(-90 36 36)\"><\u002Fcircle><text x=\"36\" y=\"40\" text-anchor=\"middle\" font-family=\"Space Grotesk\" font-weight=\"600\" font-size=\"16\" fill=\"#f1f5f9\">5/10<\u002Ftext><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"preview\">\n        <div class=\"preview-lbl\">Sparkline · KPI tiles<\u002Fdiv>\n        <svg width=\"100%\" height=\"60\" viewBox=\"0 0 160 60\" preserveAspectRatio=\"none\"><path d=\"M0 50 L26 38 L52 44 L78 26 L104 30 L130 14 L160 8\" stroke=\"#3B82F6\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath><path d=\"M0 50 L26 38 L52 44 L78 26 L104 30 L130 14 L160 8 L160 60 L0 60 Z\" fill=\"#3B82F6\" opacity=\"0.15\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"rule\"><span class=\"ic\">↳<\u002Fspan><div class=\"b\">Ring meters auto-color: <b style=\"color:var(--success)\">green<\u002Fb> when complete, <b style=\"color:var(--accent)\">yellow<\u002Fb> mid-progress, <b style=\"color:var(--danger)\">red<\u002Fb> when far behind.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 08 VOICE -->\n  <section id=\"voice\">\n    <div class=\"sec-head\"><span class=\"n\">08<\u002Fspan><h2>Voice &amp; Gujarati<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Voice-first is core. Field reps speak Gujarati; the system transcribes and structures it. Voice and AI always read purple-blue.<\u002Fp>\n\n    <div class=\"preview\">\n      <div class=\"preview-lbl\">Voice transcript block<\u002Fdiv>\n      <div style=\"padding:10px 14px;border-left:3px solid var(--purple);background:var(--surface-2);border-radius:0 8px 8px 0\">\n        <div class=\"guj\" style=\"font-size:15px;line-height:1.6\">મહેતા સાહેબને મળી આવ્યો, ડેમો સેટ થઈ ગયો. ₹3.8 લાખનું ક્વોટ મોકલવાનું છે.<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--text-subtle);font-style:italic;margin-top:8px\">EN · Met Mehta. Demo scheduled. Send ₹3.8L quote.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"demo-row\" style=\"margin-top:10px\">\n        <span class=\"pill s\">Positive<\u002Fspan>\n        <span class=\"pill b\">Next: Quote<\u002Fspan>\n        <span class=\"pill\" style=\"background:var(--surface-2);color:var(--text-muted)\">SalesReady<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"rule\"><span class=\"ic\">↳<\u002Fspan><div class=\"b\">Always show <b>Gujarati original<\u002Fb> (Noto Sans/Serif Gujarati) with an <b>English subtitle<\u002Fb> underneath. AI-extracted fields appear as confirmable rows, never auto-committed.<\u002Fdiv><\u002Fdiv>\n    <div class=\"rule\"><span class=\"ic\">↳<\u002Fspan><div class=\"b\">The mic affordance is large and obvious — a 100–120px circle that pulses red while recording with a live waveform.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 09 THEMING -->\n  <section id=\"theming\">\n    <div class=\"sec-head\"><span class=\"n\">09<\u002Fspan><h2>Day / Night<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Every screen ships in both themes. Night is default (field reps work early &amp; late). Drive everything from CSS variables — never hard-code a neutral.<\u002Fp>\n\n    <table>\n      <tbody><tr><th>Token<\u002Fth><th>Night<\u002Fth><th>Day<\u002Fth><\u002Ftr>\n      <tr><td>Background<\u002Ftd><td><span class=\"mono\">#0f172a<\u002Fspan><\u002Ftd><td><span class=\"mono\">#f4f5f8<\u002Fspan><\u002Ftd><\u002Ftr>\n      <tr><td>Surface<\u002Ftd><td><span class=\"mono\">#1e293b<\u002Fspan><\u002Ftd><td><span class=\"mono\">#ffffff<\u002Fspan><\u002Ftd><\u002Ftr>\n      <tr><td>Border<\u002Ftd><td><span class=\"mono\">#334155<\u002Fspan><\u002Ftd><td><span class=\"mono\">#e3e6ee<\u002Fspan><\u002Ftd><\u002Ftr>\n      <tr><td>Text<\u002Ftd><td><span class=\"mono\">#f1f5f9<\u002Fspan><\u002Ftd><td><span class=\"mono\">#0f172a<\u002Fspan><\u002Ftd><\u002Ftr>\n      <tr><td>Text muted<\u002Ftd><td><span class=\"mono\">#94a3b8<\u002Fspan><\u002Ftd><td><span class=\"mono\">#64748b<\u002Fspan><\u002Ftd><\u002Ftr>\n      <tr><td>Accent<\u002Ftd><td colspan=\"2\"><span class=\"mono\">#FFE600<\u002Fspan> — identical in both<\u002Ftd><\u002Ftr>\n      <tr><td>Status colors<\u002Ftd><td colspan=\"2\">Same hue, tints drop to ~10% opacity in day mode<\u002Ftd><\u002Ftr>\n    <\u002Ftbody><\u002Ftable>\n\n    <div class=\"rule do\"><span class=\"ic\">✓<\u002Fspan><div class=\"b\"><b>Do<\u002Fb> set <span class=\"mono\">data-theme=\"day\"<\u002Fspan> on a wrapper and let variables cascade.<\u002Fdiv><\u002Fdiv>\n    <div class=\"rule dont\"><span class=\"ic\">✕<\u002Fspan><div class=\"b\"><b>Don't<\u002Fb> write literal <span class=\"mono\">#1e293b<\u002Fspan> in a component. Use <span class=\"mono\">var(--surface)<\u002Fspan> so it flips automatically.<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 CHECKLIST -->\n  <section id=\"checklist\">\n    <div class=\"sec-head\"><span class=\"n\">10<\u002Fspan><h2>Build Checklist<\u002Fh2><\u002Fdiv>\n    <p class=\"sec-intro\">Run every new screen through this before shipping.<\u002Fp>\n\n    <div class=\"tok-card\" style=\"padding:8px 18px\">\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">Exactly one yellow primary action<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">A hero card with the screen's one key number in Grotesk<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">All money/numbers in Space Grotesk; refs in JetBrains Mono<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">Every metric / list item / action has a tinted icon tile<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">Status colors only from tokens; no new hues<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">Lead rows are 2 lines; heat dot only when hot<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">Mobile: primary action reachable by thumb; 44px tap targets<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">Works in both day &amp; night via CSS variables<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">Voice/AI elements read purple; Gujarati has English subtitle<\u002Fdiv><\u002Fdiv>\n      <div class=\"type-row\"><div class=\"spec\" style=\"width:30px;color:var(--accent)\">☐<\u002Fdiv><div class=\"type-sample\" style=\"font-size:14px\">No chart junk — sparklines, rings, thin bars only<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"footer\">\n    <span>Adflux · Design Rules · v1.0<\u002Fspan>\n    <span>June 2026 · hand-off ready<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
