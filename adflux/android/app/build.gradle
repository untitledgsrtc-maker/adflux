apply plugin: 'com.android.application'

android {
    namespace = "in.untitledad.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.untitledad.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Phase 76.2.2 (2026-05-23) — bumped from 1/1.0 so sideload
        // installs OVERWRITE the previous APK instead of demanding a
        // manual uninstall first. Pattern: phase × 1000 + revision.
        // Increment versionCode on every release.
        // Phase 93 (2026-05-24) — bundle for 91 + 92 + 93 (tomorrow
        // preview / missed calls / nearby leads / auto-checkout on
        // share / TC avatar polish / 20:00 IST hard-close cron /
        // in-app evening banner).
        // Phase 94a (2026-05-24) — switched to live-update mode.
        // After this APK lands, JSX/CSS changes deploy via Vercel +
        // propagate to APK users at next cold-start. No more APK
        // rebuilds for web changes. Native changes (Java, plugins,
        // splash resources) still require rebuild.
        // Phase 94b (2026-05-25) — regenerate launcher icons from
        // resources/icon.png (the patterned yellow UA mark). May 23
        // generator pass had read from stale assets/ folder; this
        // pass syncs the assets/ source + regenerates all mipmap
        // variants + adaptive icon XML.
        // Phase 95.1 (2026-05-27) — AndroidManifest <queries> block
        // added so App.openUrl() resolves tel: + whatsapp:// + mailto:
        // intents on Android 11+ (API 30) which enforces strict
        // intent visibility. Before this rebuild, Call + WhatsApp
        // buttons silently did nothing on modern phones.
        // Phase 95.4 (2026-05-27) — codex audit caught REAL root cause:
        // @capacitor/app v8 has NO openUrl() method. Migrated to
        // @capacitor/app-launcher@^8 which is the correct plugin.
        // 95.1 queries block stays — required for AppLauncher to
        // resolve handlers post-Android-11. APK rebuild required to
        // bundle the new native plugin.
        // Phase 96.0 (2026-05-27) — universal LocalNotifications for
        // OEM-immune push delivery. Adds @capacitor/local-notifications
        // plugin (new native classloader entry). Drops FCM `notification`
        // payload; client schedules LocalNotifications on every receive
        // so tray pops regardless of FG/BG. Bypasses FCM entirely for
        // follow-up reminders via AlarmManager. APK rebuild required.
        // Phase 102.D (2026-05-29) — version bump only. Carries 8 days
        // of post-96 web changes via live-update (Phase 97/98/99/100/
        // 101/102 JSX + SQL). NO native / plugin / manifest change.
        // Same signing cert (debug keystore from same Mac) so install-
        // over-existing-APK works without uninstall.
        // Phase 102.E (2026-05-29) — bump again to bundle rep status
        // pills (GPS / ONLINE / PUSH on /work bottom) into APK
        // fallback assets. Live-update would propagate same JS via
        // Vercel but bundling gives defensive coverage if server.url
        // unreachable on first cold-start.
        // Phase 102.I (2026-05-29 night) — adds @capacitor/share +
        // @capacitor/filesystem native plugins for in-app PDF share
        // sheet (rep taps Download → save → Share → WhatsApp attaches
        // PDF file). Native plugin addition = APK rebuild required.
        // Phase 102.I.1 (2026-05-29 night) — file_paths.xml cache_pdfs
        // entry + write to pdfs/ subfolder. Earlier 102.I wrote to
        // cache root which FileProvider rejected per Phase 76.2.2
        // restrictive exposure. Manifest meta-data unchanged; only
        // res/xml/file_paths.xml and the JS write path adjusted, so
        // rebuild required because file_paths.xml is bundled in res.
        // Phase 103.D.3 Step 1 — native foreground LocationTrackingService
        // (log-only). New native code → APK rebuild required.
        // Step 1 hotfix (96006) — gate the FGS on location permission so
        // a cold-start startTracking() can't crash Android 14+.
        // Step 2 (96007) — service POSTs each fix to the ingest-gps Edge
        // (native write while app closed) + setTrackingContext.
        // 96008 — production notification text (drop the debug fix-count).
        // 96009 — Phase 103.D.8 stop-after-checkout (server stop signal).
        // 96010 — Phase 121.2 rebuild: @capacitor/share (WhatsApp PDF
        //         attach) + Phase 76.2 tracking plugin land natively.
        // 96011 — Phase 155: <queries> VIEW+mailto + Gmail package so the
        //         Email button resolves the device mail app on the APK.
        // 96012 — Phase 157: MainActivity.onResume signals JS to reconcile
        //         call durations the dialer suspension dropped.
        // 96013 — Phase 162: ShareDirect plugin — quote PDF straight to
        //         Gmail / WhatsApp (recipient pre-filled, file attached).
        // 96014 — Phase 180: in-app APK updater (installApk) + GPS-capture
        //         onboarding deep-links (Location "Allow all the time" +
        //         battery Unrestricted). See CLAUDE.md §73/§74.
        // 96015 — Phase 222: <queries> VIEW+sms/smsto so the post-call
        //         "Send SMS" deep-link resolves the device Messages app.
        // 96016 — Phase 227: CallLogPlugin maps type 7 (ANSWERED_EXTERNALLY)
        //         -> "incoming" so calls answered on Bluetooth/linked device/
        //         3rd-party dialer are recorded (were dropped as "unknown").
        // 96017 — Phase 227.1: CallLogPlugin maps Realme/ColorOS custom types
        //         100 -> outgoing, 101 -> incoming (Oppo-family phones). Fixes
        //         Jayna's Realme where incoming stopped recording ~2 Jul.
        // 96018 — Phase 228 Part A: real-time incoming-call listener
        //         (CallStateReceiver + PHONE_STATE + READ_PHONE_STATE/NUMBERS +
        //         TrackingPlugin.drainPendingCalls). Captures incoming calls LIVE
        //         (ring/answer/hangup) independent of the OEM call-log TYPE —
        //         the permanent fix that supersedes the 220/227/227.1 type
        //         patches (CLAUDE.md §92). Requires APK rebuild (Part B).
        versionCode 96018
        versionName "0.96.18"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Phase 76.2.2 (2026-05-23) — packagingOptions glob block dropped
    // 2026-05-23 evening — `**/* *.png` glob untested on AGP 8.13,
    // and the prebuild-check script already catches source-tree dups
    // before cap sync. Redundant safety net with non-zero failure
    // risk = remove. If a dup still gets through somehow, Gradle
    // will fail mergeResources visibly, not silently package it.

    // Phase 76.2.2 audit close (item 2.2) — release signing scaffold.
    // ACTIVATE before the first signed release APK by:
    //   1. Generate keystore: keytool -genkey -v -keystore
    //      ~/untitledad-release.jks -keyalg RSA -keysize 2048
    //      -validity 10000 -alias untitledad
    //   2. Add to android/keystore.properties (gitignored):
    //        storeFile=/Users/apple/untitledad-release.jks
    //        storePassword=...
    //        keyAlias=untitledad
    //        keyPassword=...
    //   3. Uncomment the signingConfigs + signingConfig assignment
    //      block below.
    //   4. Add the release SHA-1 (from `keytool -list -v -keystore
    //      ~/untitledad-release.jks -alias untitledad`) to Google
    //      Cloud Console → Credentials → Android key restrictions.
    //
    // signingConfigs {
    //     release {
    //         def kp = new Properties()
    //         def kpFile = rootProject.file('keystore.properties')
    //         if (kpFile.exists()) {
    //             kp.load(new FileInputStream(kpFile))
    //             storeFile     file(kp['storeFile'])
    //             storePassword kp['storePassword']
    //             keyAlias      kp['keyAlias']
    //             keyPassword   kp['keyPassword']
    //         }
    //     }
    // }
    buildTypes {
        release {
            // Phase 76.2.2 audit close (item 2.3) — minify deferred
            // until APK size becomes a problem. R8 keep rules are
            // already in proguard-rules.pro so flipping this to
            // `true` won't strip Capacitor plugin classes.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // signingConfig signingConfigs.release  // uncomment with scaffold above
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
